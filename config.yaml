# Valuation monitor configuration
#
# Method: the current value of a metric is placed in its own distribution over the past N years (lookback_years;
# switchable on the web page) to get a historical percentile, which is then mapped to a valuation level by `levels`.

lookback_years: 10   # the number of years selected by default
lookback_options: [10, 5, 3, 2, 1]   # the number of years that can be chosen in the drop-down on the web page

# The GitHub repository of this project (owner/name). The "Order" button of the home page saves through its workflow
# home-order.yml, and every home page (GitHub Pages and Cloud Run) reads the newest order from its GitHub Pages site.
github_repository: yun-zhsh/Watchlist-monitor

# Valuation levels: a percentile <= upper falls into that level (sorted by upper ascending; the last upper must be 100)
levels:
  - { upper: 10, label: Deeply undervalued }
  - { upper: 30, label: Undervalued }
  - { upper: 70, label: Fair }
  - { upper: 90, label: Overvalued }
  - { upper: 100, label: Deeply overvalued }

# Data freshness: the update job and the scheduled workflow fail when the newest saved day is older than this many calendar days
# (the data is still saved and the site still published; the failure is what tells someone to look). Prices by market,
# long enough for weekends and holidays. Only the price and FX limits fail the run; an old newest filing is just a warning.
freshness:
  max_price_age_days: { HK: 5, US: 5, KR: 6, CN: 10, JP: 6 }
  max_fx_age_days: 7
  max_filing_age_days: 200

# Available metrics:
#   pe           PE (TTM), based on net profit attributable to owners under IFRS/GAAP
#   pe_non_ifrs  PE Non-IFRS (TTM), based on the company's Non-IFRS profit, which excludes one-off items such as investment gains
#   pe_non_gaap  PE Non-GAAP (TTM), based on the Non-GAAP profit disclosed by US-listed companies (excludes share-based compensation etc.); same idea as pe_non_ifrs
#   ps           PS (TTM), price to sales, based on revenue of the last 4 quarters
#   pb           PB, price to book, based on equity attributable to owners at the end of the latest period
# non_gaap_changes: the days a company changed the definition of its Non-GAAP EPS; a Non-GAAP TTM is only taken from four quarters of one
#   definition, so it is empty until the new one has four quarters (Cognizant, NVIDIA)
# fiscal_year_end: the month (1-12) the company's fiscal year ends, default 12. Otherwise its periods are shown with fiscal labels,
#   FY2025Q1, the fiscal year named after the calendar year it ends in (Alibaba's FY2025 ends in March 2025). Display only: the
#   periods are still calendar quarters inside the program, and the fiscal quarter shown is the one holding the last month of it.
# eps_basis: the EPS a PE metric is based on, shown in its name ("Basic PE (TTM)", "Diluted PE Non-GAAP (TTM)"). The rule: basic EPS whenever
#   the company discloses it, diluted only when it does not. Every PE is basic unless listed here, e.g. eps_basis: { pe_non_gaap: diluted }.
#   It names what the parser reads (the press_release parser takes the diluted Non-GAAP EPS only when a release has no basic one; the
#   us_press_release parser reads a Non-GAAP EPS only for pe_non_gaap: diluted, Amphenol's Adjusted Diluted EPS).
# filing_format: the layout of the earnings filings, which decides how the data is extracted
#   highlights        a financial highlights table on the first page, results every quarter (Tencent)
#   statements        only consolidated statements, usually results every half year (Sunny Optical)
#   travelsky_statements  TravelSky's consolidated statements, results every half year: IFRS until the 2020 interim results, the English
#                     translation of its CASBE (China Accounting Standards for Business Enterprises) statements from the 2020 annual results
#   press_release     earnings press release (Form 6-K) filed with the SEC on EDGAR by US-listed companies, every quarter; needs a cik
#   ifrs_statements   IFRS consolidated financial statements (HTML) furnished on Form 6-K, interim (IAS 34) every quarter and the audited annual
#                     statements for the fourth quarter (full year minus nine months); needs a cik and sec_exhibit: ifrs_statements (XP)
#   sap_ifrs          SAP's quarterly results document (press release or quarterly statement, HTML) furnished on Form 6-K, with its IFRS
#                     statements; every quarter has a three-months income statement; needs a cik and sec_exhibit: sap_ifrs (SAP)
#   tesla_update      Tesla's quarterly Update deck (exhibit 99.1 of its 8-K), its statements read from the text of the deck; a quarter whose deck
#                     has its statements as page images only is read from its Form 10-Q or 10-K; needs a cik and sec_exhibit: tesla_update (Tesla)
#   tsmc_release      TSMC's earnings release and earnings conference slides furnished on Form 6-K (diluted EPS only; equity from the slides,
#                     or for a quarter whose slides have no text balance sheet from its consolidated financial statements 6-K); needs a cik and
#                     sec_exhibit: tsmc_release (TSMC)
# sec_release_non_gaap: true also reads the earnings press release next to the IFRS statements, for its "Adjusted Basic EPS" (pe_non_gaap; XP)
#   kifrs_statements  English consolidated financial statements (K-IFRS) on the Samsung Electronics IR website, every quarter; market KR
#   cn_report         periodic reports (Q1, half-year, Q3, annual) and annual express reports of A-share companies on CNINFO (Chinese originals); market CN
#   jp_tanshin        Kessan Tanshin (summaries of consolidated results, Japanese GAAP; Japanese originals) and their corrections, from the
#                     company's IR library on Xj-Storage, every quarter (year to date after the first quarter); market JP
#   cvm_statements    the ITR (quarterly) and DFP (annual) statements Brazilian companies deliver to CVM, read by CVM's account codes from
#                     its open data, with each version's delivery time from the delivered document (a later version restates an earlier
#                     one from its own delivery time); saved as extracts of codes and values; market BR
# market: HK (HKEXnews; default for symbols ending in .HK), US (SEC EDGAR), KR (the IR website of a Korean company; default for
# symbols ending in .KS), CN (A-shares, CNINFO; default for symbols ending in .SZ or .SS) or JP (Tokyo Stock Exchange, the company's IR
# library on Xj-Storage; default for symbols ending in .T) or BR (B3, Sao Paulo; CVM; default for symbols ending in .SA).
# Accessing EDGAR requires identifying yourself: before running, set the environment variable
# SEC_USER_AGENT="valuation-monitor your-email" (see the README).
# The order below is the order of the stocks on the home page and in the reports. hidden: true leaves a stock off the home page
# only (its data is still updated; its page, downloads and MCP lookups still work). The "Order" button of the home page rewrites
# both through the workflow home-order.yml: it moves whole entries and adds or removes only the hidden: true line.
stocks:
  - symbol: META
    name: Meta Platforms
    market: US
    cik: 1326801   # Meta Platforms (Facebook until 2022)
    sec_form: 8-K   # a US company: the earnings press release is exhibit 99.1 of an 8-K with item 2.02, not a 6-K
    filing_format: us_press_release   # USD, US GAAP, basic EPS
    metrics: [pe, ps, pb]   # no pe_non_gaap: Facebook stopped reporting a Non-GAAP EPS with its first-quarter 2017 release
  - symbol: GOOGL   # Class A (Class A, B and C have the same EPS)
    name: Alphabet
    market: US
    cik: 1652044   # Alphabet Inc. (from the October 2015 reorganisation; its first release, the third quarter of 2015, is already Alphabet's)
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02
    filing_format: us_press_release   # USD, US GAAP, basic EPS (the same for Class A, B and C); 20-for-1 split in July 2022
    metrics: [pe, ps, pb]   # no pe_non_gaap: Alphabet stopped reporting a Non-GAAP EPS after its fourth-quarter 2016 release
  - symbol: MSFT   # Yahoo Finance symbol
    name: Microsoft
    market: US
    cik: 789019   # Microsoft Corporation; fiscal year ends June 30, results every calendar quarter
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02
    filing_format: us_press_release   # USD, US GAAP, basic EPS; no split since 2003
    metrics: [pe, ps, pb]   # no pe_non_gaap: Microsoft's non-GAAP EPS is diluted only, stated only in some quarters and redefined several times (see the README)
    fiscal_year_end: 6   # the fiscal year ends on June 30: the quarter to September 2026 is shown as FY2027Q1
  - symbol: AMZN
    name: Amazon.com
    market: US
    cik: 1018724   # Amazon.com, Inc.; fiscal year = calendar year
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02
    filing_format: us_press_release   # USD, US GAAP, basic EPS; 20-for-1 split in June 2022 (the releases restate the prior-year columns; see the README)
    metrics: [pe, ps, pb]   # no pe_non_gaap: Amazon has never published a Non-GAAP EPS (its releases give GAAP basic and diluted EPS only)
  - symbol: AAPL
    name: Apple
    market: US
    cik: 320193   # Apple Inc.; fiscal year ends on the last Saturday of September (52/53 weeks), results every fiscal quarter
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02
    filing_format: us_press_release   # USD, US GAAP, basic EPS; 4-for-1 split in August 2020 (the releases restate prior years; see the README)
    metrics: [pe, ps, pb]   # no pe_non_gaap: Apple reports no Non-GAAP EPS (one exception: the Q4 FY2024 EU State Aid tax charge; see the README)
    fiscal_year_end: 9   # the fiscal year ends in late September: the quarter to late September 2026 is shown as FY2026Q4, to late December 2025 as FY2026Q1
  - symbol: TSLA
    name: Tesla
    market: US
    cik: 1318605   # Tesla, Inc. (Tesla Motors, Inc. until 2017); fiscal year = calendar year, results every quarter
    sec_form: 8-K   # the quarterly Update deck is exhibit 99.1 of an 8-K with item 2.02 (the production and deliveries releases filed under it are not taken)
    sec_exhibit: tesla_update   # the Update deck; for a quarter whose deck has its statements as page images only, the Form 10-Q or 10-K
    filing_format: tesla_update   # USD, US GAAP, basic EPS; splits 5-for-1 (August 2020) and 3-for-1 (August 2022)
    metrics: [pe, pe_non_gaap, ps, pb]   # PE on basic EPS; Tesla discloses no basic Non-GAAP EPS today, so its PE Non-GAAP uses the disclosed diluted one
    eps_basis: { pe_non_gaap: diluted }   # shown as "Diluted PE Non-GAAP (TTM)"; figures until the second quarter of 2016 are on Tesla's earlier definition (noted where shown)
  - symbol: NVDA
    name: NVIDIA
    market: US
    cik: 1045810   # NVIDIA Corporation; fiscal year ends on the last Sunday of January, so its quarters end in late April, July, October and January
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02 (named after the fiscal quarter: q3fy25pr.htm)
    filing_format: us_press_release   # USD, US GAAP, basic EPS; each fiscal quarter is kept under the calendar quarter holding most of it (FY2025Q4, ended January 26, 2025: 2024Q4 inside the program); 4-for-1 split in 2021, 10-for-1 in 2024
    metrics: [pe, pe_non_gaap, ps, pb]   # NVIDIA discloses no basic Non-GAAP EPS, so its PE Non-GAAP uses the disclosed Non-GAAP diluted EPS
    eps_basis: { pe_non_gaap: diluted }   # shown as "Diluted PE Non-GAAP (TTM)"; the rows "Diluted net income per share" / "Non-GAAP" of the reconciliation
    non_gaap_changes: [2026-05-20]   # excluding stock-based compensation until fiscal 2026, including it from the first quarter of fiscal 2027 (prior periods restated)
    fiscal_year_end: 1   # the fiscal year ends in late January: the quarter ended April 28, 2024 is shown as FY2025Q1, the one ended January 26, 2025 as FY2025Q4
  - symbol: ASML
    name: ASML Holding (NY registry shares)
    market: US   # the NASDAQ line; one NY registry share = one ordinary share, so price and EPS need no ADS ratio
    cik: 937966
    sec_form: 6-K   # a foreign private issuer: a 6-K every quarter
    sec_exhibit: us_gaap_statements   # the press release has only a few figures; the quarterly US GAAP summary statements (EUR) have the rest
    filing_format: us_gaap_statements   # price in USD, earnings in EUR: converted with the EURUSD rate of each day
    metrics: [pe, ps, pb]   # ASML discloses no Non-GAAP EPS (its only non-GAAP measure is free cash flow)
  - symbol: APH
    name: Amphenol
    market: US
    cik: 820313   # Amphenol Corporation
    sec_form: 8-K   # exhibit 99.1 of an 8-K with item 2.02
    filing_format: us_press_release   # USD, US GAAP, basic EPS; 2-for-1 splits in 2014, 2021, 2024 and 2026 (the releases restate prior years; see the README)
    metrics: [pe, pe_non_gaap, ps, pb]   # PE on basic EPS; Amphenol discloses no basic Non-GAAP EPS, so its PE Non-GAAP uses the disclosed Adjusted Diluted EPS
    eps_basis: { pe_non_gaap: diluted }   # shown as "Diluted PE Non-GAAP (TTM)"; read from the reconciliation table (Q3 2016 on) or the first paragraph of the release
  - symbol: DT
    name: Dynatrace
    market: US
    cik: 1773383   # Dynatrace, Inc. (Dynatrace Holdings LLC until the August 2019 IPO); fiscal year ends March 31, results every calendar quarter
    sec_form: 8-K
    filing_format: us_press_release   # USD, US GAAP, basic EPS
    metrics: [pe, pe_non_gaap, ps, pb]   # the GAAP to Non-GAAP reconciliation in every release states a basic Non-GAAP EPS, so both PEs are basic
    fiscal_year_end: 3   # the fiscal year ends on March 31: the quarter to September 2026 is shown as FY2027Q2
  - symbol: SAP
    name: SAP (ADR)
    market: US   # NYSE; one ADS = one ordinary share, so price and EPS need no ADS ratio; a foreign private issuer filing 20-F and 6-K
    cik: 1000184   # SAP SE; fiscal year = calendar year, results every quarter
    sec_exhibit: sap_ifrs   # the 6-K exhibit with SAP's quarterly results and its IFRS statements (press release or quarterly statement)
    filing_format: sap_ifrs   # price in USD per ADS, earnings in EUR (IFRS): converted with the EURUSD rate of each day
    metrics: [pe, pe_non_ifrs, ps, pb]   # PE Non-IFRS on SAP's basic non-IFRS EPS (from continuing operations in 2023 and 2024)
  - symbol: CTSH
    name: Cognizant Technology Solutions
    market: US
    cik: 1058290
    sec_form: 8-K
    filing_format: us_press_release
    metrics: [pe, pe_non_gaap, ps, pb]
    eps_basis: { pe_non_gaap: diluted }   # Cognizant discloses no basic Non-GAAP EPS: "Diluted PE Non-GAAP (TTM)"
    non_gaap_changes: [2019-02-06]   # "Non-GAAP diluted EPS" (excluding stock-based compensation) until Q3 2018, "Adjusted Diluted EPS" (including it) from the Q4 2018 release

  - symbol: 3697.T
    name: SHIFT
    market: JP   # Tokyo Stock Exchange Prime; Japanese Kessan Tanshin from the company's IR library on Xj-Storage (as filed on TDnet)
    filing_format: jp_tanshin   # JPY, Japanese GAAP, basic EPS; splits 5-for-1 (February 2015) and 15-for-1 (January 2025)
    metrics: [pe, ps, pb]
    fiscal_year_end: 8   # the fiscal year ends on August 31: the quarter to November 2025 is shown as FY2026Q1
  - symbol: 005930.KS
    name: Samsung Electronics
    market: KR   # earnings come from the English consolidated financial statements (K-IFRS) on the Samsung IR website, every quarter
    filing_format: kifrs_statements   # EPS is the basic EPS of common stock (KRW); the Yahoo price is in KRW too, so no FX rate is needed
    metrics: [pe, ps, pb]
  - symbol: 2395.TW
    name: Advantech
    market: TW   # Taiwan Stock Exchange; English consolidated financial statements on the company IR website (MOPS refuses cloud networks)
    filing_format: tifrs_statements   # TWD, Taiwan-IFRS; basic and diluted EPS disclosed, no non-IFRS EPS; 10% stock dividends in 2014, 2017, 2020 and 2023
    metrics: [pe, ps, pb]
  - symbol: XP
    name: XP Inc.
    market: US   # NASDAQ; Class A common shares are listed directly (no ADS), a foreign private issuer filing 20-F and 6-K
    cik: 1787425
    sec_exhibit: ifrs_statements   # the press release has no basic EPS; the IFRS statements are furnished on 6-K the same day (from 2022 on mostly in a 6-K of their own)
    filing_format: ifrs_statements   # price in USD per Class A share, earnings in BRL (IFRS): converted with the BRLUSD rate of each day
    sec_release_non_gaap: true   # the press release as well, for its "Adjusted Basic EPS" (stated since the fourth quarter of 2024; quarters without adjustments stay empty)
    metrics: [pe, pe_non_gaap, ps, pb]
  - symbol: SE
    name: Sea Limited (ADR)
    market: US
    cik: 1703399   # Sea Limited (Garena until 2017)
    filing_format: us_press_release   # 6-K press release, USD, US GAAP; 1 ADS = 1 Class A ordinary share, so price and EPS need no ADS ratio
    metrics: [pe, ps, pb]   # Sea has never published a Non-GAAP EPS: an adjusted net loss without a per-share figure in 2017-2018, adjusted EBITDA since
  - symbol: BABA
    name: Alibaba Group (ADR)
    market: US
    cik: 1577552   # Alibaba Group Holding Limited; fiscal year ends March 31, results every calendar quarter
    filing_format: press_release   # the price is in USD per ADS (8 ordinary shares since the 2019 subdivision; 1 before); EPS is in RMB per ADS
    metrics: [pe, pe_non_gaap, ps, pb]   # PE on basic EPS per ADS; Alibaba discloses no basic Non-GAAP EPS, so its PE Non-GAAP uses the disclosed diluted one
    eps_basis: { pe_non_gaap: diluted }   # shown as "Diluted PE Non-GAAP (TTM)"; JD's Non-GAAP EPS is basic
    fiscal_year_end: 3   # the fiscal year ends on March 31: the quarter to September 2026 is shown as FY2027Q2
  - symbol: JD
    name: JD.com (ADR)
    market: US
    cik: 1549802   # JD.com's SEC Central Index Key
    filing_format: press_release   # the price is in USD per ADS (2 Class A ordinary shares); EPS is in RMB per ADS
    metrics: [pe, pe_non_gaap, ps, pb]
  - symbol: 0700.HK
    name: Tencent Holdings
    filing_format: highlights
    metrics: [pe, pe_non_ifrs, ps, pb]
  - symbol: 0696.HK
    name: TravelSky Technology
    filing_format: travelsky_statements   # RMB; H shares in HKD; basic EPS (equal to diluted); never a Non-IFRS EPS, so no pe_non_ifrs
    metrics: [pe, ps, pb]
  - symbol: 2382.HK
    name: Sunny Optical Technology
    filing_format: statements   # Sunny only discloses HKFRS figures, no Non-IFRS, so pe_non_ifrs is not configured
    metrics: [pe, ps, pb]
  - symbol: 002415.SZ
    name: Hikvision
    market: CN   # earnings come from the Chinese periodic reports and annual express reports on CNINFO (the CSRC-designated disclosure platform)
    filing_format: cn_report   # price and financials are both in RMB; the company does not disclose Non-GAAP figures
    metrics: [pe, ps, pb]
  - symbol: 002410.SZ
    name: Glodon
    market: CN   # Chinese periodic reports and express reports on CNINFO, like Hikvision
    filing_format: cn_report   # RMB; revenue is the operating revenue (the total also has the interest income of a small finance business)
    metrics: [pe, ps, pb]
  - symbol: 300308.SZ
    name: Zhongji Innolight
    market: CN   # ChiNext; Chinese periodic reports on CNINFO. Optical transceivers since the 2017 acquisition of Suzhou Innolight
    filing_format: cn_report   # RMB; no Non-GAAP figures
    metrics: [pe, ps, pb]
  - symbol: 600111.SS
    name: China Northern Rare Earth
    market: CN   # the first Shanghai-listed stock; Chinese periodic reports and express reports on CNINFO. Formerly Baotou Steel Rare-Earth
    filing_format: cn_report   # RMB; no Non-GAAP figures
    metrics: [pe, ps, pb]
  - symbol: 601009.SS
    name: Bank of Nanjing
    hidden: true
    market: CN   # Shanghai; Chinese periodic reports and express reports on CNINFO. A commercial bank
    filing_format: cn_report   # RMB; revenue is the operating income (net interest income included); PB uses the equity of the ordinary shareholders (without preference shares and perpetual bonds)
    metrics: [pe, ps, pb]
  - symbol: TSM
    name: Taiwan Semiconductor Manufacturing (ADR)
    market: US
    cik: 1046179   # Taiwan Semiconductor Manufacturing Co Ltd; reports under Taiwan-IFRS in NT$, every calendar quarter
    filing_format: tsmc_release   # the 6-K earnings release (revenue, net income, EPS) and conference slides (equity); the price is USD per ADR (5 common shares), EPS is NT$ per ADR
    sec_exhibit: tsmc_release   # for the quarters whose slides have no text balance sheet, the equity comes from the consolidated financial statements 6-K (statements.json)
    metrics: [pe, ps, pb]   # TSMC has never published a Non-GAAP EPS; PB on total equity including non-controlling interests (the slides give no other)
    eps_basis: { pe: diluted }   # the release gives diluted EPS only: "Diluted PE (TTM)"
  - symbol: BIDU
    name: Baidu (ADR)
    market: US
    cik: 1329099   # Baidu, Inc.; results every calendar quarter on 6-K
    filing_format: baidu_release   # the price is in USD per ADS (8 Class A ordinary shares since the 2021 subdivision; 1/10 share before); EPS is in RMB per ADS
    metrics: [pe, pe_non_gaap, ps, pb]   # PE on basic EPS per ADS; Baidu discloses no basic Non-GAAP EPS, so its PE Non-GAAP uses the disclosed diluted one
    eps_basis: { pe_non_gaap: diluted }   # no non_gaap_changes: one series across the definition changes of 2018 and 2019, the older figures carry a note
  - symbol: TOTS3.SA
    name: TOTVS
    market: BR   # B3 (Novo Mercado); the statements delivered to CVM (ITR every quarter, DFP for the year), CVM company code 019992
    filing_format: cvm_statements   # price and financials both in BRL (IFRS); ordinary shares only
    metrics: [pe, ps, pb]   # no pe_non_gaap: the only adjusted per-share figure, "EPS (LTM)" (since 1Q25), is a trailing-twelve-months figure on period-end shares
